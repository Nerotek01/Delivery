plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = project.group
version = project.version
description = project.description

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/public/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://oss.sonatype.org/content/repositories/central/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.codemc.io/repository/maven-public/' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.codemc.io/repository/nms/' }
}

dependencies {
    compileOnly 'org.spigotmc:spigot:1.8.8-R0.1-SNAPSHOT'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'org.mongodb:mongodb-driver-sync:5.1.4'
    implementation 'redis.clients:jedis:5.1.5'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'org.slf4j:slf4j-jdk14:2.0.13'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'

    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.github.NuVotifier:NuVotifier:2.7.2'
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version.toString())
    }
}

shadowJar {
    archiveBaseName.set('DeliveryMan')
    archiveClassifier.set('')
    archiveVersion.set(project.version.toString())

    relocate 'com.zaxxer.hikari', 'com.nerotek01.libs.hikari'
    relocate 'com.mongodb', 'com.nerotek01.libs.mongodb'
    relocate 'org.bson', 'com.nerotek01.libs.bson'
    relocate 'redis.clients.jedis', 'com.nerotek01.libs.jedis'
    relocate 'org.apache.commons.pool2', 'com.nerotek01.libs.pool2'
    relocate 'com.google.gson', 'com.nerotek01.libs.gson'
    relocate 'org.json.simple', 'com.nerotek01.libs.jsonsimple'
    relocate 'org.slf4j', 'com.nerotek01.libs.slf4j'

    mergeServiceFiles()

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'module-info.class'

    dependencies {
        exclude(dependency('org.mongodb:bson-record-codec'))
    }
}

build {
    dependsOn shadowJar
}

jar {
    archiveBaseName.set('DeliveryMan')
    archiveClassifier.set('slim')
}
