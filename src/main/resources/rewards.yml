    id: daily
    slot: 13
    permission: "delivery.daily"
    countdown: 1
    timeUnit: DAYS
    rewards:
      - "mysterydust add <player> 5"
    noPermission:
      sound: BLOCK_ANVIL_LAND
      volume: 1
      pitch: 1
      message: "&cYou don't have permission for this."
    noClaimed:
      material: CHEST_MINECART
      data: 0
      amount: 1
      message: "&eYou claimed your &adaily delivery&e! &a+5 &eMystery Dust received."
